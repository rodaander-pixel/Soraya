<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Soraya ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, #421522 0%, #160b0f 35%, #050505 75%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .contenedor {
      width: 100%;
      max-width: 900px;
      text-align: center;
      animation: aparecer 1.5s ease;
    }

    .corazon {
      font-size: 45px;
      margin-bottom: 18px;
      animation: latido 2.5s infinite;
    }

    h1 {
      font-size: clamp(30px, 7vw, 52px);
      font-weight: 500;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: #c8c8c8;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .video-contenedor {
      width: 100%;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.12);
    }

    video {
      width: 100%;
      display: block;
      max-height: 75vh;
    }

    .final {
      margin-top: 30px;
      color: #d0d0d0;
      font-size: 16px;
      line-height: 1.7;
    }

    .final strong {
      color: white;
      font-size: 19px;
      font-weight: 500;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes latido {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="corazon">❤️</div>

    <h1>Para Soraya</h1>

    <p class="subtitulo">
      Gracias por llegar hasta aquí.
    </p>

    <div class="video-contenedor">
      <video controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4">
        Tu navegador no puede reproducir este vídeo.
      </video>
    </div>

    <div class="final">
      <p>
        Después de todo lo que hemos vivido...
      </p>

      <br>

      <strong>
        Solo quiero que veas esto. ❤️
      </strong>
    </div>

  </main>

</body>
</html>
